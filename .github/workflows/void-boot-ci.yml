name: Void Boot CI

on:
  push:
    branches: [feature/void-boot-foundation]
    paths:
      - "apps/void-boot/**"
      - "apps/desktop/**"
      - "docs/VOID_BOOT_ARCHITECTURE.md"
      - "README.md"
      - "scripts/build-void-boot-demo-iso.sh"
      - ".github/workflows/void-boot-ci.yml"
  pull_request:
    paths:
      - "apps/void-boot/**"
      - "apps/desktop/**"
      - "docs/VOID_BOOT_ARCHITECTURE.md"
      - "README.md"
      - "scripts/build-void-boot-demo-iso.sh"
      - ".github/workflows/void-boot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (Void Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/void-boot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/void-boot
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets

  desktop-integration:
    name: Void Memingo integration checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Typecheck and build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Test desktop Rust backend
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  boot-menu-iso:
    name: Build bootable Void Boot menu ISO
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GRUB BIOS/UEFI and ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pre-boot graphical menu ISO
        run: bash scripts/build-void-boot-demo-iso.sh apps/void-boot/profiles/example-profiles.toml "$RUNNER_TEMP/void-boot-demo.iso"
      - name: Verify ISO artifact exists
        run: test -s "$RUNNER_TEMP/void-boot-demo.iso"
      - uses: actions/upload-artifact@v4
        with:
          name: void-boot-graphical-menu-iso
          path: ${{ runner.temp }}/void-boot-demo.iso
          if-no-files-found: error
