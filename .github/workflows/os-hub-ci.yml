name: Atdev OS Hub CI

on:
  push:
    branches: [main, desktop-v0.5-foundation]
    paths:
      - "apps/os-hub/**"
      - ".github/workflows/os-hub-ci.yml"
  pull_request:
    paths:
      - "apps/os-hub/**"
      - ".github/workflows/os-hub-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/os-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
