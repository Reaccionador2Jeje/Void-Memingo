name: Desktop CI

on:
  push:
    branches:
      - main
      - desktop-v0.5-foundation
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck and build frontend
        run: npm run build

  tauri-linux:
    name: Tauri Rust backend check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend assets
        working-directory: apps/desktop
        run: |
          npm install
          npm run build

      - name: Check native Tauri backend
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  cli:
    name: Preserve CLI compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test existing CLI
        run: |
          cargo test
          cargo build --release
          sh -n install.sh
