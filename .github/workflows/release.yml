name: Release Void Memingo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release files
        run: |
          mkdir -p release
          cp target/release/void release/void-linux-x86_64
          cd release
          sha256sum void-linux-x86_64 > void-linux-x86_64.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/void-linux-x86_64
            release/void-linux-x86_64.sha256
