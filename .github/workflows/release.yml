name: Release Void Memingo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: void-linux-x86_64
            binary: void
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: void-windows-x86_64.exe
            binary: void.exe
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            asset: void-macos-x86_64
            binary: void
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            asset: void-macos-aarch64
            binary: void
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run tests
        run: cargo test --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare binary and SHA-256
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/${{ matrix.asset }}"
          python -c "import hashlib,pathlib; p=pathlib.Path('release/${{ matrix.asset }}'); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\\n')"
      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release and VS Code extension
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package Visual Studio Code extension
        working-directory: vscode-extension
        run: |
          npm install --global @vscode/vsce
          vsce package --out ../release/void-memingo-vscode.vsix
      - name: Publish Visual Studio Code extension
        working-directory: vscode-extension
        run: vsce publish --oidc
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
