[package]
name = "void-memingo"
version = "0.2.0"
edition = "2024"
description = "Void Memingo - OS toolkit, language, and terminal interface"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"

[[bin]]
name = "void"
path = "src/main.rs"
