# Experimental GRUB loopback recipes for Ubuntu and its official desktop flavours.
# These entries use the casper layout and iso-scan/filename kernel parameter.
# Keep them experimental until each exact release is boot-tested in BIOS and UEFI.
[[profiles]]
id = "ubuntu-live-amd64-experimental"
name = "Ubuntu Live (experimental)"
iso = "iso/ubuntu-amd64.iso"
kernel = "casper/vmlinuz"
initrd = "casper/initrd"
linux_args = ["boot=casper", "quiet", "splash"]
iso_path_argument = "iso-scan/filename"

